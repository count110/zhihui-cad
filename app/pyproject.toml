[project]
name = "zhihui-cad"
version = "0.1.0"
description = "智绘CAD · 云端MCP驱动CAD生成与修改平台（参赛版 MVP）"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.3",
    "mcp>=1.10",
    "pydantic>=2.6",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "openai>=1.30",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# 任意实体的三维布尔运算（并/差/交）。2026-10-20 经用户同意作为可选依赖引入；不装时只支持 z 向棱柱的布尔。
solid = ["manifold3d>=3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zhihui*"]

[tool.setuptools.package-data]
"zhihui.cad" = ["symbols/*.json"]
"zhihui" = ["kb/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:ezdxf.*"]
