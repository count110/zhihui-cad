[project]
name = "zhihui-cad"
version = "0.1.0"
description = "LLM agent for chemical engineering drawings: pressure vessel drawings, process flow diagrams (PFD/P&ID) and general 2D/3D CAD from natural language (智绘CAD)"
license = {text = "MIT"}
keywords = ["llm", "cad", "text-to-cad", "ai-agent", "chemical-engineering", "pressure-vessel", "process-flow-diagram", "pid", "dxf", "ezdxf", "mcp", "autocad", "deepseek"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Scientific/Engineering", "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based", "Natural Language :: Chinese (Simplified)"]
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.3",
    "mcp>=1.10",
    "pydantic>=2.6",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "openai>=1.30",
    "shapely>=2.0",
]

[project.urls]
Homepage = "https://github.com/count110/zhihui-cad"
Repository = "https://github.com/count110/zhihui-cad"

[project.optional-dependencies]
dev = ["pytest>=8"]
# 任意实体的三维布尔运算（并/差/交）。2026-10-20 经用户同意作为可选依赖引入；不装时只支持 z 向棱柱的布尔。
solid = ["manifold3d>=3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zhihui*"]

[tool.setuptools.package-data]
"zhihui.cad" = ["symbols/*.json"]
"zhihui" = ["kb/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:ezdxf.*"]
